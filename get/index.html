<script>
  // Phones go straight to their store. Campaign tags (?ct=tiktok etc.) pass through.
  // PT is the App Store Connect provider token (App Analytics > Campaigns > Generate link).
  // Until it is filled in, iOS installs are not attributed by campaign.
  (function () {
    var PT = '';
    var ua = navigator.userAgent || '';
    var ct = (location.search.match(/[?&]ct=([\w-]{1,40})/) || [])[1];
    var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) location.replace('https://apps.apple.com/us/app/ember-migraine-tracker/id6762041852' + (ct && PT ? '?pt=' + PT + '&ct=' + ct + '&mt=8' : ''));
    else if (/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.cascadeheadache.ember' + (ct ? '&referrer=utm_source%3D' + ct : ''));
  })();
</script>
