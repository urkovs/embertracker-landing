<body class="util-page">
<a class="skip" href="#main">Skip to content</a>


<div class="util">
  <a class="brand" href="../../" aria-label="Ember home"><img src="../../assets/v3/orb-120.webp" alt="" width="30" height="30">Ember</a>
  <main id="main" class="util-main">
    <div class="util-card">
      <img class="util-orb" src="../../assets/v3/orb-app-240.webp" alt="" aria-hidden="true" width="120" height="120">
      <h1 class="t-h2">Send to provider</h1>
      <p class="util-line">Scan the code with your phone, or tap <span class="nowrap">Open Ember</span>.</p>
      <p class="print-only">Scan with your phone to open Ember.</p>
      <div class="util-qr">
        <!-- Payload: ember://clinic/cascade-headache (QR version 3, error correction Q; decoded with CoreImage) -->
        <img src="../../assets/v3/qr-clinic-cascade-headache.svg" alt="QR code that opens Ember with this clinic’s report inbox filled in." width="176" height="176">
      </div>
      <button class="btn btn--lg" id="open-ember" type="button">Open Ember</button>
      <p class="util-note" id="open-note" aria-live="polite">Review before sending.</p>
      <p class="util-store">Get Ember: <a href="https://apps.apple.com/app/id6762041852">App Store</a><span class="sep" aria-hidden="true">·</span><a href="https://play.google.com/store/apps/details?id=com.cascadeheadache.ember">Google Play</a></p>
    </div>
  </main>
</div>

<script>
  const button = document.getElementById('open-ember');
  const note = document.getElementById('open-note');
  button.addEventListener('click', () => {
    note.textContent = 'Opening Ember…';
    window.location.href = 'ember://clinic/cascade-headache';
    window.setTimeout(() => {
      if (document.visibilityState === 'visible') {
        note.textContent = 'If Ember didn’t open, check that it’s installed and try again.';
      }
    }, 1400);
  });
</script>
</body>
