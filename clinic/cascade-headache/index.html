<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Send To Provider | Ember Migraine Tracker</title>
  <link rel="icon" href="../../favicon.png" />
  <link rel="canonical" href="https://embertracker.app/clinic/cascade-headache/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ember" />
  <meta property="og:title" content="Send to provider · Ember" />
  <meta property="og:description" content="Scan with your phone or tap to open Ember." />
  <meta property="og:url" content="https://embertracker.app/clinic/cascade-headache/" />
  <meta property="og:image" content="https://embertracker.app/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Send to provider · Ember" />
  <meta name="twitter:description" content="Scan with your phone or tap to open Ember." />
  <meta name="twitter:image" content="https://embertracker.app/assets/og-image.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --card: #151515;
      --border: #2a2a2a;
      --text: #e8e6e3;
      --body: #c9c5c0;
      --muted: #8a847b;
      --ember: #ecaa68;
      --button: oklch(0.78 0.11 68);
      --button-hover: oklch(0.82 0.1 70);
      --button-active: oklch(0.73 0.1 66);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--body);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 440px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px 24px 24px;
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(236, 170, 104, 0.18);
    }
    .mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transform: scale(1.55);
    }
    h1 {
      margin: 0;
      color: var(--text);
      font: 600 30px/1.15 Georgia, "Times New Roman", serif;
    }
    p { margin: 12px auto 0; max-width: 34ch; font-size: 16px; line-height: 1.5; }
    .qr {
      width: min(100%, 214px);
      margin: 20px auto 0;
      padding: 10px;
      border-radius: 16px;
      background: #f6f2ea;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }
    .qr img { width: 100%; height: auto; display: block; }
    .button {
      width: 100%;
      min-height: 52px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      background: var(--button);
      color: var(--bg);
      font: 700 17px/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      transition: background-color 180ms cubic-bezier(0.16, 1, 0.3, 1), transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .button:hover { background: var(--button-hover); }
    .button:active { background: var(--button-active); transform: scale(0.99); }
    .button:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.45; }
    a { color: var(--ember); }
    @media print {
      body { display: block; padding: 0; background: #fbfaf7; color: #17120d; }
      main { margin: 0 auto; border: 0; background: #fbfaf7; }
      h1 { color: #17120d; }
      .qr { box-shadow: none; border: 1px solid #d9d1c5; }
      .button, .note { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <img src="../../assets/onboarding-ember.png" alt="" width="1024" height="1024" />
    </div>
    <h1>Send To Provider</h1>
    <p>Scan with your phone or tap below.</p>
    <div class="qr">
      <img src="../../assets/clinic-cascade-headache-qr.svg" alt="QR code to open Ember directly for Cascade Headache" width="37" height="37" />
    </div>
    <button class="button" id="open-ember" type="button">Open Ember</button>
    <p class="note" id="open-note">Review before sending.</p>
    <p class="note">Get Ember: <a href="https://apps.apple.com/app/id6762041852">App Store</a> · <a href="https://play.google.com/store/apps/details?id=com.cascadeheadache.ember">Google Play</a></p>
  </main>
  <script>
    const button = document.getElementById('open-ember');
    const note = document.getElementById('open-note');
    button.addEventListener('click', () => {
      note.textContent = 'Opening Ember…';
      window.location.href = 'ember://clinic/cascade-headache';
      window.setTimeout(() => {
        if (document.visibilityState === 'visible') {
          note.textContent = 'If Ember did not open, make sure it is installed and try again.';
        }
      }, 1400);
    });
  </script>
</body>
</html>
